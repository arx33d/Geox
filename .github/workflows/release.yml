name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover tests

      - name: Build Windows Binaries
        shell: powershell
        run: |
          & .\tools\build_windows.ps1

      - name: Generate Checksums
        shell: powershell
        run: |
          Get-FileHash Geox.exe, GeoxSetup.exe -Algorithm SHA256 | Out-File -FilePath checksums-sha256.txt
          Get-Content checksums-sha256.txt

      - name: Package Release Zip
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Geox-$tag-Windows.zip"
          Compress-Archive -Path "Geox.exe", "GeoxSetup.exe", "START_GEOX.bat", "run_geox.bat", "geox", "web", "offline", "tools", "requirements.txt", "README.md", "LICENSE" -DestinationPath $zipName
          Write-Host "Created $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Geox.exe
            GeoxSetup.exe
            checksums-sha256.txt
            Geox-*-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
