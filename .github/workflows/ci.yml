name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint with ruff
        run: |
          python -m ruff check geox tests

      - name: Run unit test suite
        run: |
          python -m unittest discover tests

  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Windows Launcher and Setup
        shell: powershell
        run: |
          & .\tools\build_windows.ps1

      - name: Verify Executables
        shell: powershell
        run: |
          if (-not (Test-Path "Geox.exe")) { throw "Geox.exe was not created" }
          if (-not (Test-Path "GeoxSetup.exe")) { throw "GeoxSetup.exe was not created" }
          Write-Host "Geox.exe hash: $((Get-FileHash Geox.exe).Hash)"
          Write-Host "GeoxSetup.exe hash: $((Get-FileHash GeoxSetup.exe).Hash)"

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geox-windows-binaries
          path: |
            Geox.exe
            GeoxSetup.exe
